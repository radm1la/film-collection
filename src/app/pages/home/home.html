<div class="home">
      <input
        appAutofocus
        type="text"
        placeholder="Search films..."
        (input)="onSearch($event)"
        class="search-input"
      />

      @if (filmService.filteredFilms().length === 0) {
        <p class="empty">Nothing found 🎬</p>
      } @else {
        <div class="film-grid">
          @for (film of filmService.filteredFilms(); track film.id) {
            <div class="card" [class.favorite]="film.isFavorite">

              <a [routerLink]="['/film', film.id]">
                <img [src]="film.posterUrl" [alt]="film.title" />
                <div class="card-info">
                  <h3>{{ film.title }}</h3>
                  <p class="meta">{{ film.year }} · {{ film.genre }}</p>
                  <p class="rating">⭐ {{ film.rating }} / 10</p>
                  <p class="duration">⏱ {{ film.duration | durationPipe }}</p>
                </div>
              </a>

              <button (click)="filmService.toggleFavorite(film.id)">
                {{ film.isFavorite ? '❤️ Remove from favorites' : '🤍 Add to favorites' }}
              </button>

            </div>
          }
        </div>
      }
    </div>
