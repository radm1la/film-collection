<div class="home">
      <input
        appAutofocus
        type="text"
        placeholder="Search films..."
        (input)="onSearch($event)"
        class="search-input"
      />

      @if (filmService.filteredFilms().length === 0) {
        <p class="empty"><i class="fa-solid fa-magnifying-glass"></i> Nothing found</p>
      } @else {
        <div class="film-grid">
          @for (film of filmService.filteredFilms(); track film.id) {
            <app-film-card
              [film]="film"
              (favoriteToggle)="filmService.toggleFavorite(film.id)"
            ></app-film-card>
          }
        </div>
      }
    </div>
